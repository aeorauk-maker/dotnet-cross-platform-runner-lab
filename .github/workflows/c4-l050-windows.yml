name: C4 L050 Windows cache discriminator
on:
  push:
    branches:
      - c4-l050-windows-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run inert Unicode cache matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          $env:C4_RUNS_ROOT = Join-Path $env:RUNNER_TEMP 'c4-l050'
          New-Item -ItemType Directory -Force -Path $env:C4_RUNS_ROOT | Out-Null
          $scriptPath = Join-Path $env:RUNNER_TEMP 'c4-l050-matrix.py'
          $py = @'
          #!/usr/bin/env python3
          """Owned C4-L050 Windows matrix. Inert fixtures are embedded by workflow generator."""
          
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import uuid
          
          HERE = Path(__file__).resolve().parent
          RUNS_ROOT = Path(os.environ.get("C4_RUNS_ROOT", str(HERE / "runs"))).resolve()
          DOTNET = Path(shutil.which("dotnet") or "dotnet")
          SDK_VERSION = os.environ.get("C4_SDK_VERSION", "11.0.100")
          TFM = os.environ.get("C4_TFM", "net11.0")
          EXPECTED = {
              "trusted": "8898fcd9f94c8935738fd8bd7e8f355f118fd77623c074a3e8743599536d23d4",
              "lower": "10cf727aa62b62fe3f0ae6eeaed2aa7d97ea03ce1a4caec06fe47b7d4736fa59",
          }
          
          
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def make_project(path, package_id):
              path.mkdir(parents=True)
              (path / "project.csproj").write_text(
                  f'<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>{TFM}</TargetFramework></PropertyGroup>'
                  f'<ItemGroup><PackageReference Include="{package_id}" Version="1.0.0" /></ItemGroup></Project>\n'
              )
          
          
          def config(path, trusted, lower):
              path.write_text(
                  '<?xml version="1.0" encoding="utf-8"?><configuration>'
                  '<packageSources><clear/>'
                  f'<add key="trusted" value="{trusted}"/><add key="lower" value="{lower}"/>'
                  '</packageSources><packageSourceMapping>'
                  '<packageSource key="trusted"><package pattern="Company.Σ"/></packageSource>'
                  '<packageSource key="lower"><package pattern="*"/></packageSource>'
                  '</packageSourceMapping></configuration>\n'
              )
          
          
          def main():
              stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              run_dir = RUNS_ROOT / f"build-target-{stamp}-{uuid.uuid4().hex[:6]}"
              run_dir.mkdir(parents=True)
              probe_dir = run_dir / "path-probe"
              probe_dir.mkdir()
              probe_a = probe_dir / "σ"
              probe_b = probe_dir / "ς"
              probe_a.write_text("ONLY-SIGMA")
              path_alias = probe_b.exists() and os.path.samefile(probe_a, probe_b)
              (run_dir / "global.json").write_text(
                  json.dumps({"sdk": {"version": SDK_VERSION, "rollForward": "disable"}}) + "\n")
              feeds = run_dir / "feeds"
              trusted = feeds / "trusted"
              lower = feeds / "lower"
              lower_exact = feeds / "lower-exact"
              empty = feeds / "empty-trusted"
              for directory in (trusted, lower, lower_exact, empty):
                  directory.mkdir(parents=True)
              tp = trusted / "Company.Σ.1.0.0.nupkg"
              lp = lower / "Company.ς.1.0.0.nupkg"
              tp.write_bytes(base64.b64decode(""))
              lp.write_bytes(base64.b64decode(""))
              # Keep exact and variant in distinct feed directories: the local default
              # APFS volume can alias sigma/final-sigma filenames in one directory.
              shutil.copyfile(tp, lower_exact / tp.name)
              assert digest(tp) == EXPECTED["trusted"]
              assert digest(lp) == EXPECTED["lower"]
              cfg = run_dir / "NuGet.Config"
              denied_cfg = run_dir / "Denied.NuGet.Config"
              exact_denied_cfg = run_dir / "ExactDenied.NuGet.Config"
              config(cfg, trusted, lower)
              config(denied_cfg, empty, lower)
              config(exact_denied_cfg, empty, lower_exact)
              victim = run_dir / "victim"
              seed = run_dir / "seed"
              make_project(victim, "Company.Σ")
              make_project(seed, "Company.ς")
              env = os.environ.copy()
              env.update({
                  "DOTNET_CLI_HOME": str(run_dir / "cli-home"),
                  "DOTNET_CLI_TELEMETRY_OPTOUT": "1",
                  "DOTNET_SKIP_FIRST_TIME_EXPERIENCE": "1",
                  "NUGET_HTTP_CACHE_PATH": str(run_dir / "http-cache"),
                  "MSBUILDDISABLENODEREUSE": "1",
                  "DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER": "1",
              })
              logs = run_dir / "logs"
              logs.mkdir()
              cases = {}
          
              def invoke(case, action, args, packages):
                  command = [str(DOTNET), *args]
                  result = subprocess.run(command, cwd=run_dir, env=env, text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          timeout=120)
                  log = logs / f"{case}-{action}.txt"
                  log.write_text("COMMAND=" + " ".join(command) + "\nEXIT=" + str(result.returncode) + "\n" + result.stdout)
                  return {"exit": result.returncode, "log": str(log.relative_to(run_dir)), "sha256": digest(log)}
          
              def reset_victim_outputs():
                  for name in ("bin", "obj"):
                      path = victim / name
                      if path.exists():
                          shutil.rmtree(path)
                  marker = victim / "L050-marker.txt"
                  if marker.exists():
                      marker.unlink()
          
              def restore(case, project, config_path, packages):
                  return invoke(case, "restore", ["restore", str(project / "project.csproj"),
                      "--configfile", str(config_path), "--packages", str(packages), "-v", "normal"], packages)
          
              def victim_case(name, config_path, packages, build=True):
                  reset_victim_outputs()
                  row = {"restore": restore(name, victim, config_path, packages)}
                  if row["restore"]["exit"] == 0 and build:
                      assets = json.loads((victim / "obj" / "project.assets.json").read_text())
                      row["libraries"] = sorted(assets["libraries"])
                      generated = victim / "obj" / "project.csproj.nuget.g.targets"
                      row["generated_targets"] = generated.read_text() if generated.exists() else None
                      row["build"] = invoke(name, "build", ["build", str(victim / "project.csproj"),
                          "--no-restore", "-p:UseSharedCompilation=false", "-m:1", "-v", "normal"], packages)
                      marker = victim / "L050-marker.txt"
                      row["marker"] = marker.read_text().strip() if marker.exists() else None
                  else:
                      row["marker"] = None
                  cases[name] = row
          
              clean = run_dir / "cache-clean"
              denied = run_dir / "cache-denied"
              shared = run_dir / "cache-shared"
              reverse = run_dir / "cache-reverse"
              exact_denied = run_dir / "cache-exact-denied"
              for path in (clean, denied, shared, reverse, exact_denied):
                  path.mkdir()
          
              victim_case("clean-valid", cfg, clean)
              victim_case("clean-denied", denied_cfg, denied)
              cases["variant-seed"] = {"restore": restore("variant-seed", seed, cfg, shared),
                                        "seed_marker": (seed / "L050-marker.txt").exists()}
              victim_case("seeded-victim", cfg, shared)
              victim_case("isolated-victim", cfg, denied)
              victim_case("reverse-victim-first", cfg, reverse)
              cases["reverse-seed"] = {"restore": restore("reverse-seed", seed, cfg, reverse)}
              victim_case("reverse-victim-after", cfg, reverse)
              victim_case("exact-id-lower-denied", exact_denied_cfg, exact_denied, build=False)
          
              cache_metadata = sorted(shared.glob("company.*/1.0.0/.nupkg.metadata"))
              sdk_info = subprocess.check_output([str(DOTNET), "--info"], cwd=run_dir,
                                                 env=env, text=True)
              sdk_base = Path(next(line.split(":", 1)[1].strip()
                                   for line in sdk_info.splitlines()
                                   if line.strip().startswith("Base Path:")))
              evidence = {
                  "run_dir": str(run_dir),
                  "utc": stamp,
                  "dotnet": str(DOTNET),
                  "dotnet_version": subprocess.check_output([str(DOTNET), "--version"], cwd=run_dir, env=env, text=True).strip(),
                  "platform": platform.platform(),
                  "github_context": {name: os.environ.get(name) for name in
                                     ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_RUN_ID",
                                      "GITHUB_JOB", "RUNNER_OS", "RUNNER_NAME")},
                  "path_probe": {"sigma_final_sigma_alias": path_alias,
                                 "sigma_read": probe_a.read_text(),
                                 "final_sigma_exists": probe_b.exists()},
                  "target_framework": TFM,
                  "sdk_base_path": str(sdk_base),
                  "nuget_dll_sha256": {name: digest(sdk_base / name)
                                        for name in ("NuGet.Commands.dll", "NuGet.Packaging.dll", "NuGet.Configuration.dll", "NuGet.Protocol.dll")},
                  "package_sha256": {"trusted": digest(tp), "lower": digest(lp)},
                  "project_sha256": {"victim": digest(victim / "project.csproj"), "seed": digest(seed / "project.csproj")},
                  "config_sha256": {"normal": digest(cfg), "denied": digest(denied_cfg),
                                    "exact_denied": digest(exact_denied_cfg)},
                  "shared_cache_metadata": {str(p.relative_to(shared)): json.loads(p.read_text()) for p in cache_metadata},
                  "cases": cases,
              }
              result_file = run_dir / "result.json"
              result_file.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + "\n")
              summary = {key: {"restore": value["restore"]["exit"],
                               "build": value.get("build", {}).get("exit"),
                               "marker": value.get("marker"),
                               "libraries": value.get("libraries")}
                         for key, value in cases.items() if "restore" in value}
              print(json.dumps({"result": str(result_file), "sha256": digest(result_file),
                                "summary": summary}, indent=2, ensure_ascii=False))
              assert cases["clean-valid"]["marker"] == "TRUSTED-FEED"
              assert cases["clean-denied"]["restore"]["exit"] != 0
              assert cases["variant-seed"]["restore"]["exit"] == 0
              assert not cases["variant-seed"]["seed_marker"]
              assert cases["isolated-victim"]["marker"] == "TRUSTED-FEED"
              assert cases["reverse-victim-after"]["marker"] == "TRUSTED-FEED"
              assert cases["exact-id-lower-denied"]["restore"]["exit"] != 0
              return 0
          
          
          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception as error:
                  print(f"MATRIX_SETUP_OR_ASSERTION_FAILURE: {error}", file=sys.stderr)
                  raise
          '@
          Set-Content -Path $scriptPath -Value $py -Encoding utf8
          python $scriptPath | Tee-Object -FilePath (Join-Path $env:C4_RUNS_ROOT 'stdout.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve inert logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-l050-windows-inert-matrix
          path: ${{ runner.temp }}/c4-l050/**
          if-no-files-found: warn
