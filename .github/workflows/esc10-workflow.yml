name: ESC10 encrypted owned validation
on:
  push:
    branches: [esc10-id01-20261120]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare generic encrypted runner
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography requests beautifulsoup4
      - name: Run encrypted owned validation
        shell: pwsh
        env:
          ESC10_ID01_KEY: ${{ secrets.ESC10_ID01_KEY }}
        run: python esc10-public-runner.py
      - name: Retain encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esc10-encrypted-result
          path: out/*.enc
          if-no-files-found: warn
          retention-days: 1
