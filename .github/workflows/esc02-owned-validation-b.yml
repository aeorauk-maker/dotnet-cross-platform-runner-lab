name: ESC02 sealed owned validation B
on:
  push:
    branches:
      - esc02-proxy-20261120
    paths:
      - .github/workflows/esc02-owned-validation-b.yml
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare owned local service
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq squid
          sudo systemctl stop squid.service || true
          printf '127.0.0.1 example.invalid\n' | sudo tee -a /etc/hosts >/dev/null
      - name: Run sealed owned fixture
        shell: pwsh
        env:
          ESC02_KEY: ${{ secrets.ESC02_PROXY_LAB_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ESC02_KEY) { throw 'Fixture key unavailable' }
          [byte[]]$key = [Convert]::FromBase64String($env:ESC02_KEY)
          [byte[]]$sealed = [Convert]::FromBase64String('')
          [byte[]]$nonce = $sealed[0..11]
          [byte[]]$cipher = $sealed[12..($sealed.Length - 17)]
          [byte[]]$tag = $sealed[($sealed.Length - 16)..($sealed.Length - 1)]
          [byte[]]$plain = New-Object byte[] $cipher.Length
          $aes = [Security.Cryptography.AesGcm]::new($key, 16)
          $aes.Decrypt($nonce, $cipher, $tag, $plain, [Text.Encoding]::UTF8.GetBytes('esc02-yarp-squid-v1'))
          $aes.Dispose()
          [IO.File]::WriteAllBytes('lab.zip', $plain)
          Expand-Archive -Path lab.zip -DestinationPath . -Force
          /usr/bin/curl -4 -fLsS -o payload/yarp.reverseproxy.2.3.0.nupkg https://api.nuget.org/v3-flatcontainer/yarp.reverseproxy/2.3.0/yarp.reverseproxy.2.3.0.nupkg
          /usr/bin/curl -4 -fLsS -o payload/system.io.hashing.8.0.0.nupkg https://api.nuget.org/v3-flatcontainer/system.io.hashing/8.0.0/system.io.hashing.8.0.0.nupkg
          if ((Get-FileHash 'payload/yarp.reverseproxy.2.3.0.nupkg' -Algorithm SHA256).Hash -ne 'FF12EF5F9C46C3F3E815575A45B7598C68043B9EB101A9AAB18ED3BD8C025A24') { throw 'Package hash mismatch' }
          if ((Get-FileHash 'payload/system.io.hashing.8.0.0.nupkg' -Algorithm SHA256).Hash -ne 'B33386B744CD068E9D11D0B781FE87F9EF585B7370D30A1AE949C218618AE5C1') { throw 'Dependency hash mismatch' }
          dotnet restore payload/YarpBenefit.csproj --source payload -v:q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build payload/YarpBenefit.csproj --no-restore -v:q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $env:ESC02_DOTNET = (Get-Command dotnet).Source
          $result = python payload/run_benefit_squid.py 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Fixture failed' }
          [byte[]]$resultBytes = [Text.Encoding]::UTF8.GetBytes($result)
          [byte[]]$outNonce = New-Object byte[] 12
          [Security.Cryptography.RandomNumberGenerator]::Fill($outNonce)
          [byte[]]$outCipher = New-Object byte[] $resultBytes.Length
          [byte[]]$outTag = New-Object byte[] 16
          $outAes = [Security.Cryptography.AesGcm]::new($key, 16)
          $outAes.Encrypt($outNonce, $resultBytes, $outCipher, $outTag, [Text.Encoding]::UTF8.GetBytes('esc02-yarp-squid-result-v1'))
          $outAes.Dispose()
          [byte[]]$outSealed = $outNonce + $outCipher + $outTag
          $encoded = [Convert]::ToBase64String($outSealed)
          Write-Output ('ESC02_SQUID_LENGTH=' + $encoded.Length)
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 160) {
            $take = [Math]::Min(160, $encoded.Length - $offset)
            Write-Output ('ESC02_SQUID_PART=' + $encoded.Substring($offset, $take))
          }
