name: W4 encrypted owned validation

on:
  push:
    branches: [w4-private-validation-20261120]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed encrypted input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install evidence encryption dependency
        run: python -m pip install cryptography==46.0.3
      - name: Execute private controlled validation and encrypt evidence
        env:
          H4_VALIDATION_KEY: ${{ secrets.H4_VALIDATION_KEY }}
        run: python scripts/run-encrypted-linux.py
      - name: Retain encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-validation-evidence
          path: encrypted-run-output.bin
          if-no-files-found: warn
          retention-days: 1
