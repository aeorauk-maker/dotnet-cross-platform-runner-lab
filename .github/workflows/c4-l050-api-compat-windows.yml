name: C4 L050 Windows SDK baseline discriminator
on:
  push:
    branches:
      - c4-l050-windows-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run inert SDK baseline matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:C4_RUNS_ROOT = Join-Path $env:RUNNER_TEMP 'c4-l050-api'
          New-Item -ItemType Directory -Force -Path $env:C4_RUNS_ROOT | Out-Null
          $scriptPath = Join-Path $env:RUNNER_TEMP 'c4-l050-api.py'
          $py = @'
          #!/usr/bin/env python3
          """C4-L050 Windows SDK API-compatibility discriminator, inert owned packages."""

          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import uuid

          TRUSTED_B64 = ""
          LOWER_B64 = ""
          EXPECTED_TRUSTED = "418e12aa70858ad1347c4a13b0bcea84615ee41f0cb56d9468bf0bbb0ee87ce4"
          EXPECTED_LOWER = "b6c1e9749b87bea2ed55ebae5d8da74e13987e57e00ab051a6d84835e3d0c51c"
          RUNS_ROOT = Path(os.environ.get("C4_RUNS_ROOT", Path(__file__).resolve().parent))
          DOTNET = shutil.which("dotnet") or "dotnet"


          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()


          def write_config(path, trusted, lower):
              path.write_text(
                  '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear/>'
                  f'<add key="trusted" value="{trusted}"/><add key="lower" value="{lower}"/>'
                  '</packageSources><packageSourceMapping>'
                  '<packageSource key="trusted"><package pattern="Company.Σ"/></packageSource>'
                  '<packageSource key="lower"><package pattern="*"/></packageSource>'
                  '</packageSourceMapping></configuration>\n', encoding="utf-8")


          def main():
              stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              root = RUNS_ROOT / f"api-compat-{stamp}-{uuid.uuid4().hex[:6]}"
              root.mkdir(parents=True)
              (root / "global.json").write_text(
                  '{"sdk":{"version":"11.0.100","rollForward":"disable"}}\n', encoding="utf-8")
              probe = root / "path-probe"
              probe.mkdir()
              (probe / "company.σ").write_text("sigma", encoding="utf-8")
              alias = (probe / "company.ς").exists() and os.path.samefile(
                  probe / "company.σ", probe / "company.ς")
              (probe / "company.ς").write_text("final-sigma", encoding="utf-8")
              feeds = root / "feeds"
              trusted = feeds / "trusted"
              lower = feeds / "lower"
              empty = feeds / "empty"
              for p in (trusted, lower, empty):
                  p.mkdir(parents=True)
              tp = trusted / "Company.Σ.1.0.0.nupkg"
              lp = lower / "Company.ς.1.0.0.nupkg"
              tp.write_bytes(base64.b64decode(TRUSTED_B64))
              lp.write_bytes(base64.b64decode(LOWER_B64))
              assert sha(tp) == EXPECTED_TRUSTED
              assert sha(lp) == EXPECTED_LOWER
              cfg = root / "NuGet.Config"
              denied = root / "Denied.NuGet.Config"
              write_config(cfg, trusted, lower)
              write_config(denied, empty, lower)
              logs = root / "logs"
              logs.mkdir()
              envbase = {**os.environ, "DOTNET_CLI_HOME": str(root / "cli-home"),
                         "DOTNET_CLI_TELEMETRY_OPTOUT": "1",
                         "DOTNET_SKIP_FIRST_TIME_EXPERIENCE": "1",
                         "MSBUILDDISABLENODEREUSE": "1",
                         "DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER": "1",
                         "NUGET_HTTP_CACHE_PATH": str(root / "http-cache")}

              def invoke(name, args, cache):
                  command = [DOTNET, *args]
                  env = {**envbase, "NUGET_PACKAGES": str(cache)}
                  proc = subprocess.run(command, cwd=root, env=env, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                        timeout=240)
                  log = logs / f"{name}.txt"
                  log.write_text("COMMAND=" + " ".join(command) + "\nEXIT=" +
                                 str(proc.returncode) + "\n" + proc.stdout, encoding="utf-8")
                  return {"exit": proc.returncode, "log": str(log.relative_to(root)),
                          "sha256": sha(log), "cp0002": "CP0002" in proc.stdout,
                          "nu5052": "NU5052" in proc.stdout}

              def make_victim(name, valid=False):
                  path = root / name
                  path.mkdir()
                  (path / "project.csproj").write_text(
                      '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup>'
                      '<TargetFramework>net11.0</TargetFramework>'
                      '<AssemblyName>Company.Contract</AssemblyName>'
                      '<PackageId>Company.Core</PackageId><Version>2.0.0</Version>'
                      '<EnablePackageValidation>true</EnablePackageValidation>'
                      '<PackageValidationBaselineVersion>1.0.0</PackageValidationBaselineVersion>'
                      '<PackageValidationBaselineName>Company.Σ</PackageValidationBaselineName>'
                      '<RunApiCompat>true</RunApiCompat>'
                      '</PropertyGroup></Project>\n', encoding="utf-8")
                  api = " public static void Approved() {}" if valid else ""
                  (path / "Contract.cs").write_text(
                      "namespace Company; public static class Contract "
                      "{ public static void Relaxed() {}" + api + " }\n", encoding="utf-8")
                  return path

              rows = {}

              def victim_case(name, cache, source_config=cfg, valid=False):
                  project = make_victim(name, valid)
                  row = {"project_sha256": sha(project / "project.csproj"),
                         "source_sha256": sha(project / "Contract.cs")}
                  row["restore"] = invoke(name + "-restore", ["restore",
                      str(project / "project.csproj"), "--configfile",
                      str(source_config), "-v", "normal"], cache)
                  if row["restore"]["exit"] == 0:
                      row["assets_sha256"] = sha(project / "obj/project.assets.json")
                      row["pack"] = invoke(name + "-pack", ["pack",
                          str(project / "project.csproj"), "--no-restore", "-c", "Release",
                          "-p:UseSharedCompilation=false", "-m:1", "-v", "normal"], cache)
                      package = project / "bin/Release/Company.Core.2.0.0.nupkg"
                      row["output_package_sha256"] = sha(package) if package.exists() else None
                  rows[name] = row

              def seed(name, cache):
                  project = root / name
                  project.mkdir()
                  (project / "project.csproj").write_text(
                      '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup>'
                      '<TargetFramework>net11.0</TargetFramework></PropertyGroup>'
                      '<ItemGroup><PackageReference Include="Company.ς" Version="1.0.0" />'
                      '</ItemGroup></Project>\n', encoding="utf-8")
                  rows[name] = {"project_sha256": sha(project / "project.csproj"),
                                "restore": invoke(name + "-restore", ["restore",
                                str(project / "project.csproj"), "--configfile",
                                str(cfg), "-v", "normal"], cache), "build_invoked": False}

              caches = {name: root / ("cache-" + name) for name in
                        ("valid", "clean", "denied", "shared", "isolated", "reverse")}
              for p in caches.values():
                  p.mkdir()
              victim_case("valid-compatible", caches["valid"], valid=True)
              victim_case("breaking-clean", caches["clean"])
              victim_case("breaking-denied", caches["denied"], denied)
              seed("variant-seed", caches["shared"])
              victim_case("breaking-seeded", caches["shared"])
              victim_case("breaking-isolated", caches["isolated"])
              victim_case("breaking-reverse-first", caches["reverse"])
              seed("reverse-seed", caches["reverse"])
              victim_case("breaking-reverse-after", caches["reverse"])
              for row in rows.values():
                  if "pack" in row:
                      row["pack_exit"] = row["pack"]["exit"]
              cache_entries = {name: [{"relative_path": str(p.relative_to(cache)),
                                       "sha256": sha(p)} for p in cache.rglob("*.nupkg")]
                               for name, cache in caches.items()}
              sdk_info = subprocess.check_output([DOTNET, "--info"], cwd=root,
                                                 env=envbase, text=True)
              sdk_base = Path(next(line.split(":", 1)[1].strip()
                                   for line in sdk_info.splitlines()
                                   if line.strip().startswith("Base Path:")))
              result = {"utc": stamp, "root": str(root), "platform": platform.platform(),
                        "github_context": {key: os.environ.get(key) for key in
                                           ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_RUN_ID",
                                            "GITHUB_JOB", "RUNNER_OS", "RUNNER_NAME")},
                        "sdk": subprocess.check_output([DOTNET, "--version"], cwd=root,
                                                       env=envbase, text=True).strip(),
                        "sdk_base": str(sdk_base),
                        "nuget_dll_sha256": {name: sha(sdk_base / name) for name in
                              ("NuGet.Commands.dll", "NuGet.Packaging.dll",
                               "NuGet.Configuration.dll", "NuGet.Protocol.dll")},
                        "path_probe": {"sigma_final_sigma_alias": alias,
                                       "sigma_read": (probe / "company.σ").read_text(encoding="utf-8"),
                                       "final_sigma_read": (probe / "company.ς").read_text(encoding="utf-8")},
                        "package_sha256": {"trusted": sha(tp), "lower": sha(lp)},
                        "config_sha256": {"normal": sha(cfg), "denied": sha(denied)},
                        "cache_entries": cache_entries, "cases": rows}
              path = root / "result.json"
              path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              summary = {k: {"restore": r["restore"]["exit"],
                             "pack": r.get("pack_exit"),
                             "cp0002": r.get("pack", {}).get("cp0002")}
                         for k, r in rows.items()}
              print(json.dumps({"result": str(path), "sha256": sha(path),
                                "summary": summary}, ensure_ascii=False, indent=2))
              checks = [rows["valid-compatible"]["pack_exit"] == 0,
                        rows["breaking-clean"]["pack"]["cp0002"],
                        rows["breaking-denied"]["restore"]["exit"] != 0,
                        rows["variant-seed"]["restore"]["exit"] == 0,
                        rows["breaking-isolated"]["pack"]["cp0002"],
                        rows["breaking-reverse-first"]["pack"]["cp0002"],
                        rows["breaking-reverse-after"]["pack"]["cp0002"]]
              return 0 if all(checks) else 2


          if __name__ == "__main__":
              sys.exit(main())
          '@
          Set-Content -Path $scriptPath -Value $py -Encoding utf8
          python $scriptPath | Tee-Object -FilePath (Join-Path $env:C4_RUNS_ROOT 'stdout.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve inert SDK baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-l050-windows-api-compat
          path: ${{ runner.temp }}/c4-l050-api/**
          if-no-files-found: warn
