name: ESC02 isolated Windows validation
on:
  push:
    branches:
      - esc02-proxy-20261120
    paths:
      - .github/workflows/esc02-isolated-validation.yml
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run sealed owned fixture
        shell: pwsh
        env:
          ESC02_KEY: ${{ secrets.ESC02_PROXY_LAB_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ESC02_KEY) { throw 'Fixture key unavailable' }
          [byte[]]$key = [Convert]::FromBase64String($env:ESC02_KEY)
          [byte[]]$sealed = [Convert]::FromBase64String('')
          [byte[]]$nonce = $sealed[0..11]
          [byte[]]$cipher = $sealed[12..($sealed.Length - 17)]
          [byte[]]$tag = $sealed[($sealed.Length - 16)..($sealed.Length - 1)]
          [byte[]]$plain = New-Object byte[] $cipher.Length
          $aes = [Security.Cryptography.AesGcm]::new($key, 16)
          $aes.Decrypt($nonce, $cipher, $tag, $plain, [Text.Encoding]::UTF8.GetBytes('esc02-owned-lab-v1'))
          $aes.Dispose()
          [IO.File]::WriteAllBytes('lab.zip', $plain)
          Expand-Archive -Path lab.zip -DestinationPath . -Force
          $project = Get-ChildItem payload -Filter '*.csproj' | Select-Object -First 1
          if (-not $project) { throw 'Fixture project missing' }
          dotnet build $project.FullName -v:q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
          $runner = Get-ChildItem payload -Filter '*.py' | Select-Object -First 1
          if (-not $runner) { throw 'Fixture runner missing' }
          $result = python $runner.FullName 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Fixture run failed' }
          [byte[]]$resultBytes = [Text.Encoding]::UTF8.GetBytes($result)
          [byte[]]$outNonce = New-Object byte[] 12
          [Security.Cryptography.RandomNumberGenerator]::Fill($outNonce)
          [byte[]]$outCipher = New-Object byte[] $resultBytes.Length
          [byte[]]$outTag = New-Object byte[] 16
          $outAes = [Security.Cryptography.AesGcm]::new($key, 16)
          $outAes.Encrypt($outNonce, $resultBytes, $outCipher, $outTag, [Text.Encoding]::UTF8.GetBytes('esc02-result-v1'))
          $outAes.Dispose()
          [byte[]]$outSealed = $outNonce + $outCipher + $outTag
          $encoded = [Convert]::ToBase64String($outSealed)
          Write-Output ('ESC02_RESULT_LENGTH=' + $encoded.Length)
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 160) {
            $take = [Math]::Min(160, $encoded.Length - $offset)
            Write-Output ('ESC02_RESULT_PART=' + $encoded.Substring($offset, $take))
          }
