          echo "E83 exit=$status83; E84 exit=$status84; evidence encrypted"
          cp "$RUNNER_TEMP/g07-results.cms" ./g07-results.cms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-l095-e92-sealed-evidence
          path: g07-results.cms
          if-no-files-found: ignore
          retention-days: 1
